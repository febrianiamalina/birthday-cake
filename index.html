<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday!</title>
  <style>
    body {
      background: #ffe5ec;
      font-family: sans-serif;
      text-align: center;
      padding-top: 50px;
    }
    h1 {
      color: #d6336c;
    }
    #cake {
      position: relative;
      margin: 0 auto;
      width: 200px;
      height: 200px;
    }
    .candle {
      width: 10px;
      height: 60px;
      background: #ff6f61;
      position: absolute;
      left: 50%;
      top: 30px;
      transform: translateX(-50%);
    }
    .flame {
      width: 20px;
      height: 30px;
      background: radial-gradient(ellipse at center, #ffd700 0%, #ff8c00 70%);
      border-radius: 50%;
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      animation: flicker 0.2s infinite;
    }
    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1); opacity: 1; }
      50% { transform: translateX(-52%) scale(1.1); opacity: 0.8; }
      100% { transform: translateX(-50%) scale(1); opacity: 1; }
    }
    #message {
      font-size: 1.5em;
      margin-top: 20px;
      color: #6a0572;
      display: none;
    }
  </style>
</head>
<body>

<h1>🎉 Happy Birthday! 🎉</h1>
<p>Blow out the candle!</p>
<div id="cake">
  <div class="candle">
    <div class="flame" id="flame"></div>
  </div>
  <img src="https://raw.githubusercontent.com/febrianiamalina/birthday-cake/main/rustic-pastel-cakes-1080x1080-1.jpg" alt="Cake" width="200">
</div>
<div id="message">Make a wish! ✨</div>

<script>
  async function listenForBlow() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const context = new AudioContext();
    const mic = context.createMediaStreamSource(stream);
    const analyser = context.createAnalyser();
    mic.connect(analyser);

    const data = new Uint8Array(analyser.frequencyBinCount);

    function checkVolume() {
      analyser.getByteFrequencyData(data);
      const volume = data.reduce((a, b) => a + b) / data.length;

      if (volume > 30) { // Threshold, tweak as needed
        document.getElementById('flame').style.display = 'none';
        document.getElementById('message').style.display = 'block';
        stream.getTracks().forEach(track => track.stop());
      } else {
        requestAnimationFrame(checkVolume);
      }
    }

    checkVolume();
  }

  listenForBlow();
</script>

</body>
</html>
